# Public HTTPS site, on top of portal-postgres-compose.yml (or portal-compose.yml):
#   PORTAL_DOMAIN=example.com docker compose -f portal-postgres-compose.yml -f portal-owner-compose.yml \
#       -f portal-public-compose.yml up -d --build
# Caddy obtains and renews the TLS certificate automatically (ports 80 and 443 must reach this server).
services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set PORTAL_DOMAIN to the site's domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./runtime/caddy/data:/data
      - ./runtime/caddy/config:/config
    networks:
      edge:
        ipv4_address: 172.30.50.10
    depends_on: [portal]
    logging:
      options:
        max-size: 10m
        max-file: "3"
  portal:
    environment:
      PORTAL_ORIGIN: https://${PORTAL_DOMAIN:?Set PORTAL_DOMAIN}
      PORTAL_ALLOW_LOCAL_HTTP: "0"
      PORTAL_TRUSTED_PROXY_IPS: 172.30.50.10
    networks:
      default:
      edge:
        ipv4_address: 172.30.50.20
  account-worker:
    networks: [default, edge]
networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.50.0/24
