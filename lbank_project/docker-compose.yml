services:
  lbank-bot:
    build: .
    command: ["python", "-u", "lbank_bot.py"]
    restart: unless-stopped
    init: true
    environment:
      LBANK_API_KEY: ${LBANK_API_KEY:-}
      LBANK_SECRET_KEY: ${LBANK_SECRET_KEY:-}
      BOT_PIN: ${BOT_PIN:?Set BOT_PIN in .env}
      PAPER_EQUITY: ${PAPER_EQUITY:-10000}
      PAPER_DATA_MODE: ${PAPER_DATA_MODE:-demo}
      OHLCV_DIR: /app/runtime/ohlcv
      FUNDING_DIR: /app/runtime/funding
      BOT_CONFIG: /app/runtime/config.json
      BOT_DB: /app/runtime/lbank_ichimoku_bot.db
      C3_CONFIG: /app/runtime/c3_config.json
      C3_DB: /app/runtime/c3_sleeve.db
      PA_CONFIG: /app/runtime/pa_config.json
      PA_DB: /app/runtime/pa_sleeve.db
    volumes:
      - ./runtime:/app/runtime
    stop_grace_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"
  lbank-candles:
    build: .
    command: ["python", "-u", "lbank_candles.py"]
    restart: unless-stopped
    init: true
    environment:
      OHLCV_DIR: /app/runtime/ohlcv
      BOT_CONFIG: /app/runtime/config.json
      C3_CONFIG: /app/runtime/c3_config.json
      PA_CONFIG: /app/runtime/pa_config.json
    volumes:
      - ./runtime:/app/runtime
    logging:
      options:
        max-size: 10m
        max-file: "3"
  lbank-funding:
    build: .
    command: ["sh", "-c", "while true; do for c in config c3_config pa_config; do python fetch_funding.py /app/$$c.json; done; sleep 3600; done"]
    restart: unless-stopped
    init: true
    environment:
      FUNDING_DIR: /app/runtime/funding
    volumes:
      - ./runtime:/app/runtime
    logging:
      options:
        max-size: 10m
        max-file: "3"
  lbank-dashboard:
    build: .
    command: ["uvicorn", "dashboard_server:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    init: true
    environment:
      LBANK_API_KEY: ${LBANK_API_KEY:-}
      LBANK_SECRET_KEY: ${LBANK_SECRET_KEY:-}
      BOT_PIN: ${BOT_PIN:?Set BOT_PIN in .env}
      PAPER_EQUITY: ${PAPER_EQUITY:-10000}
      PAPER_DATA_MODE: ${PAPER_DATA_MODE:-demo}
      OHLCV_DIR: /app/runtime/ohlcv
      FUNDING_DIR: /app/runtime/funding
      BOT_CONFIG: /app/runtime/config.json
      BOT_DB: /app/runtime/lbank_ichimoku_bot.db
      C3_CONFIG: /app/runtime/c3_config.json
      C3_DB: /app/runtime/c3_sleeve.db
      PA_CONFIG: /app/runtime/pa_config.json
      PA_DB: /app/runtime/pa_sleeve.db
    volumes:
      - ./runtime:/app/runtime
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      options:
        max-size: 10m
        max-file: "3"
