name: ML filter unit tests
on:
  pull_request:
    paths:
      - 'high_cagr/ml_trade_filter.py'
      - 'high_cagr/test_ml_trade_filter.py'
      - '.github/workflows/ml-filter-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install numpy pandas numba pytest
      - name: Run tests without historical archives
        run: python -m pytest -q high_cagr/test_ml_trade_filter.py
