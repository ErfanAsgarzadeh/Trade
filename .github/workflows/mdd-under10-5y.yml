name: MDD-under-10 causal risk frontier 5-year study
on:
  push:
    branches: [research/mdd-under10-20261103]
    paths:
      - ai_research/mdd10_frontier.py
      - ai_research/test_mdd10_frontier.py
      - ai_research/mdd10_stress.py
      - ai_research/test_mdd10_stress.py
      - .github/workflows/mdd-under10-5y.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: >-
          python -m pip install
          numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
          scikit-learn==1.7.2 numba==0.61.2 matplotlib==3.10.7
          pytest==8.4.2
      - name: Causality and risk-budget invariants
        run: python -m pytest ai_research/test_mdd10_frontier.py ai_research/test_mdd10_stress.py -q
      - name: Search fixed predeclared risk budget frontier, lock 2025-26 test
        run: python -u -m ai_research.mdd10_frontier
      - name: Stress 2025-26 losses and run pre-2025 block bootstrap
        run: python -u -m ai_research.mdd10_stress
      - name: Print evidence and MDD pass/fail
        run: |
          cat ai_research/output/mdd_under10/results.md
          ls -lh ai_research/output/mdd_under10/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdd-under10-frontier-research
          path: ai_research/output/mdd_under10/
          retention-days: 45
