name: 1536 1h entries / 4h Ichimoku/EMA Chabok research
on:
  pull_request:
    paths:
      - "high_cagr/chabok_1536_research.py"
      - ".github/workflows/chabok-1h-sweep.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search-1h:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lbank_project
            high_cagr/chabok_historical_backtest.py
            high_cagr/chabok_1536_research.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JIT dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 numba==0.61.2
      - name: Run 1h entry / 4h trend 1536 configuration search
        run: python -u high_cagr/chabok_1536_research.py
        env:
          CHABOK_BAR_MINUTES: "60"
          PYTHONPATH: lbank_project
      - name: Upload complete research ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chabok-1536-strategy-search-1h
          path: |
            high_cagr/output/chabok_sweep_1536_60m/result.json
            high_cagr/output/chabok_sweep_1536_60m/all_candidates.csv
            high_cagr/output/chabok_sweep_1536_60m/all_candidates.jsonl
          if-no-files-found: ignore
          retention-days: 30
