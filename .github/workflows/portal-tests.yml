name: Portal ownership and queue tests
on:
  push:
    paths: [lbank_project/**, .github/workflows/portal-tests.yml]
  pull_request:
    paths: [lbank_project/**, .github/workflows/portal-tests.yml]
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portal_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: portal_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U portal_test -d portal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: lbank_project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and test Next.js frontend
        working-directory: lbank_project/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: python -m pip install -r lbank_project/requirements-dev.txt -r lbank_project/requirements-portal.txt
      - run: python -m pytest lbank_project/tests/test_portal.py lbank_project/tests/test_portal_queue.py lbank_project/tests/test_multi_exchange.py lbank_project/tests/test_capital_licensing.py lbank_project/tests/test_customer_distribution.py lbank_project/tests/test_portal_frontend.py lbank_project/tests/test_signup_products.py lbank_project/tests/test_admin_workbench.py lbank_project/tests/test_public_backtest.py lbank_project/tests/test_blog.py lbank_project/tests/test_payments.py lbank_project/tests/test_telegram.py lbank_project/tests/test_referrals.py -q
        env:
          PYTHONPATH: lbank_project
          PORTAL_TEST_DATABASE_URL: postgresql://portal_test:disposable-ci-password@127.0.0.1:5432/portal_test
          PORTAL_TEST_ALLOW_RESET: "1"
      - name: Test TheTrueTrade equity and live mirror adapters
        run: python -m pytest lbank_project/tests/test_live_mirror.py lbank_project/tests/test_ttt_stop_audit.py lbank_project/tests/test_ttt_one_time_tpsl.py lbank_project/tests/test_ttt_account_audit.py lbank_project/tests/test_ttt_protection_readback.py lbank_project/tests/test_ttt_live_readiness.py lbank_project/tests/test_paper_forward_audit.py -q
        env:
          PYTHONPATH: lbank_project

      - name: Browser subscription journey and responsive layouts
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python -m pytest lbank_project/tests/test_portal_browser.py lbank_project/tests/test_admin_browser.py lbank_project/tests/test_landing_browser.py -q
        env:
          PYTHONPATH: lbank_project
          PORTAL_TEST_PLAYWRIGHT_BROWSER: "1"
