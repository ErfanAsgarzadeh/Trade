name: Portal ownership and queue tests
on:
  push:
    paths: [lbank_project/**, .github/workflows/portal-tests.yml]
  pull_request:
    paths: [lbank_project/**, .github/workflows/portal-tests.yml]
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portal_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: portal_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U portal_test -d portal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: lbank_project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r lbank_project/requirements-dev.txt -r lbank_project/requirements-portal.txt
      - run: python -m pytest lbank_project/tests/test_portal.py lbank_project/tests/test_portal_queue.py lbank_project/tests/test_multi_exchange.py -q
        env:
          PYTHONPATH: lbank_project
          PORTAL_TEST_DATABASE_URL: postgresql://portal_test:disposable-ci-password@127.0.0.1:5432/portal_test
          PORTAL_TEST_ALLOW_RESET: "1"
      - run: node lbank_project/tests/test_portal_ui.cjs
