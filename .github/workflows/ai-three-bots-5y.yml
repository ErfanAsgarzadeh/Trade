name: AI meta-label 5-year three-bot study
on:
  push:
    branches: [research/ai-meta-trade-selection-5y]
    paths:
      - ai_research/**
      - .github/workflows/ai-three-bots-5y.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical and ML dependencies
        run: python -m pip install "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.7.2" "pytest==8.4.2" "numba==0.61.2" "matplotlib==3.10.7"
      - name: Verify causality and split constraints
        run: python -m pytest ai_research/test_experiment.py ai_research/test_market.py ai_research/test_bandit.py ai_research/test_cdra.py -q
      - name: Verify new profit-protection and F-risk baselines in source branch
        run: python -m ai_research.current_baseline
      - name: Screen OEM against current Shahin entries on cached 35-coin five-year trade ledger (not F)
        run: python -m ai_research.oem_ledger_screen
      - name: Screen hierarchical Bayesian per-bot side and coin risk models on cached 35-coin ledger
        run: python -m ai_research.bayesian_side
      - name: Evaluate frozen predeclared models on 2991 trades
        run: python -m ai_research.experiment
      - name: Preserve ledger-only decisions
        run: mv ai_research/output/all_2991_decisions.csv ai_research/output/ledger_decisions.csv
      - name: Restore SHA256 checked historical minute bars
        run: python restore_data.py
      - name: Evaluate BTC 4h causal market regimes with same frozen AI holdout
        run: python -m ai_research.btc_market
      - name: Test causal conformal distributional tail-risk sizing versus daily F-style proxy
        run: python -m ai_research.cdra_daily
      - name: Select and evaluate online expert AI versus F on latest protected three-bot ledger
        run: python -m ai_research.bandit_on_f
      - name: Print results
        run: |
          cat ai_research/output/result.json
          cat ai_research/output/btc_market_result.json
          cat ai_research/output/oem_vs_F.json
          cat ai_research/output/oem_ledger_screen.json
          cat ai_research/output/bayesian_side_screen.json
          cat ai_research/output/cdra_daily_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-three-bots-five-year-study
          path: ai_research/output/
          retention-days: 30
