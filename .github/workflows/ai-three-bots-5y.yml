name: AI meta-label 5-year three-bot study
on:
  push:
    branches: [research/ai-meta-trade-selection-5y]
    paths:
      - ai_research/**
      - .github/workflows/ai-three-bots-5y.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ai_research
            high_cagr/output/ideas/three_bots/trades.csv
            .github/workflows/ai-three-bots-5y.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical and ML dependencies
        run: python -m pip install "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.7.2" "pytest==8.4.2"
      - name: Verify causality and split constraints
        run: python -m pytest ai_research/test_experiment.py -q
      - name: Evaluate frozen predeclared models on 2991 trades
        run: python -m ai_research.experiment
      - name: Print results
        run: cat ai_research/output/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-three-bots-five-year-study
          path: ai_research/output/
          retention-days: 30
