name: Growth recovery research: causal BTC hedge vs 10pct MDD
on:
  push:
    branches: [research/mdd-under10-20261103]
    paths:
      - ai_research/mdd10_growth_hedge.py
      - ai_research/test_mdd10_growth_hedge.py
      - .github/workflows/mdd10-growth.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hedge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: >-
          python -m pip install
          numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
          scikit-learn==1.7.2 numba==0.61.2 matplotlib==3.10.7
          pytest==8.4.2
      - name: Unit-test causal hedge and selection logic
        run: python -m pytest ai_research/test_mdd10_growth_hedge.py -q
      - name: Restore SHA256-verified historical BTC futures one-minute archives
        run: python restore_data.py
      - name: Train-free pre2025 candidate search with causal BTC downtrend hedges
        run: python -u -m ai_research.mdd10_growth_hedge
      - name: Summarize selected candidates and CAGR target
        run: cat ai_research/output/mdd_under10/growth_hedge_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-hedge-growth-screen
          path: ai_research/output/mdd_under10/growth_hedge*
          retention-days: 30
